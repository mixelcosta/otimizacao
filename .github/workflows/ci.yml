name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-test:
    name: Build e Testes (.NET 8)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restaurar dependências
        run: dotnet restore HardwareOptimizer.sln

      - name: Build (Release, warnings = erros)
        run: dotnet build HardwareOptimizer.sln -c Release --no-restore

      - name: Testes
        run: dotnet test HardwareOptimizer.sln -c Release --no-build --verbosity normal
